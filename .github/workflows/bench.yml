name: bench
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check. The Go and Rust runs share one container, so the
  # ratio compares the same machine. Three tables: default threads on a reused caller pool, one
  # thread, and no caller pool (the shared pool).
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          load: true
          push: false
          tags: cadmus-bench:local
          cache-from: type=gha,scope=cadmus-rs-bench
          cache-to: type=gha,mode=max,scope=cadmus-rs-bench
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      # shell: bash runs with -o pipefail, so a class above 1.10 in bench.sh fails the job.
      - shell: bash
        run: |
          { echo '### Time per class, ms: the Go library and this crate on the same machine (lower is better); default and x86-64-v4 builds'; echo
            docker run --rm cadmus-bench:local sh tests/parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
