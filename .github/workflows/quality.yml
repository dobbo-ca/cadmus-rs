name: quality
# A pull request runs it while it carries the label `quality`: when the label is added and on every
# push to the PR after that.
on: { workflow_dispatch: {}, push: { branches: [main] }, pull_request: { types: [labeled, synchronize, reopened] } }
permissions:
  contents: read
# A new run waits for the one before it; it never cancels it.
concurrency:
  # Another label's event skips the job; its own group keeps it from replacing a pending gate run.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'quality' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false
jobs:
  # Not a required check. Real-file OCR gate (docs/quality.md): the label, macro and
  # thumbnail pages of the OpenSlide subset, decoded with tiff-rs and jpeg-rs and cut once into
  # text-line crops, run through the Go oracle and examples/oracle.rs (1 thread and default threads);
  # every output (text, words, confidences, activations hash) must be byte-identical. The report
  # (summary.md, labels.log, diff-*.txt, logs) is the artifact quality-ocr.
  exact:
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'quality') || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'quality'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: quality-report
          push: false
          outputs: type=local,dest=quality-out
          cache-from: type=gha,scope=cadmus-rs-quality
          cache-to: type=gha,mode=max,scope=cadmus-rs-quality
      - if: always()
        run: cat quality-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-ocr
          path: quality-out
      - run: exit "$(cat quality-out/status)"
