[package]
name = "cadmus-quality-labels"
version = "0.0.0"
edition = "2024"
publish = false
description = "Cuts text-line crops out of the label pages of whole-slide images for the OCR quality gate (docs/quality.md)."

[dependencies]
# tiff-rs main (jpeg-rs and deflate-rs come with it). CI only: this tool is not part of the crate.
tiff = { git = "https://github.com/dobbo-ca/tiff-rs", rev = "8511ab4468be2ce08df1c6c7c5019a120b9e4838" }

# jpeg-rs and deflate-rs come in through tiff-rs, so this is the same decoder as tiff-rs's.

# Not part of the root package.
[workspace]
